version: '3.8'

# 简化部署版本 - 适用于共享服务器
# 使用SQLite数据库，单一后端服务

services:
  # Django后端 + 前端静态文件
  app:
    build:
      context: ../..
      dockerfile: deployment/deploy-simple/Dockerfile
    container_name: device-platform
    ports:
      - "${PORT:-8081}:8081"
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - ALLOWED_HOSTS=*
      - SERVER_URL=${SERVER_URL:-http://localhost:8081}
      - DOCKER_REGISTRY_URL=registry:5000
    volumes:
      - app_data:/app/data
      - app_media:/app/media
      - ./static:/app/static:ro  # 挂载 static 目录（只读）
      - /var/run/docker.sock:/var/run/docker.sock  # 挂载Docker socket
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - registry

  # Docker Registry - 存储镜像
  registry:
    image: registry:2
    container_name: device-registry
    ports:
      - "5000:5000"
    volumes:
      - registry_data:/var/lib/registry
    restart: unless-stopped

volumes:
  app_data:
  app_media:
  registry_data:

