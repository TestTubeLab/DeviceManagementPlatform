# 可选覆盖文件。启用时须纳入平台更新器的 Compose 文件清单。
services:
  app:
    ports:
      - "${DMP_SSH_TLS_BIND:-127.0.0.1}:8443:8443"
    environment:
      DEVICE_SSH_MANAGEMENT_ENABLED: "1"
      DEVICE_SSH_BUILTIN_TLS: "1"
      DEVICE_SSH_TRUST_HTTPS_PROXY: "1"
      DEVICE_SSH_PUBLIC_URL: "${DEVICE_SSH_PUBLIC_URL:?Set the HTTPS API URL reachable by the device Agent}"
    volumes:
      - "${DMP_SSH_TLS_DIR:-/etc/device-platform/ssh-management-tls}/server:/etc/nginx/ssh-management-tls:ro"
