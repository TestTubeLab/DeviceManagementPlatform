worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # 全局强制 UTF-8 编码（确保所有响应都包含 charset）
    charset utf-8;
    charset_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml;

    # 上传文件大小限制（5GB）
    client_max_body_size 5G;

    map $uri $dmp_login_limit_key {
        default "";
        ~^/api/auth/login/?$ $binary_remote_addr;
        ~^/admin/login/?$ $binary_remote_addr;
    }

    limit_req_zone $dmp_login_limit_key zone=dmp_login:1m rate=8r/m;

    server {
        listen 8081;
        # 由入口脚本按需启用；与 HTTP 共用一份路由和维护门禁。
        include /run/device-platform-nginx/*.conf;
        server_name _;
        limit_req zone=dmp_login burst=5 nodelay;
        limit_req_status 429;

        # 前端静态文件
        root /usr/share/nginx/html;
        index index.html;

        # Vue Router history模式
        location / {
            include /run/device-platform-nginx/*.location;
            if (-f /run/platform-updates/maintenance) { return 503; }
            try_files $uri $uri/ /index.html;
        }

        # API代理到Django
        location /api/ {
            if (-f /run/platform-updates/maintenance) { return 503; }
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 保留后端的 Content-Type（包括 charset）
            proxy_pass_header Content-Type;
            
            # 超时设置（大文件上传）
            proxy_read_timeout 600s;
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            
            # 请求体超时
            client_body_timeout 600s;
            
            # 禁用缓冲，直接传输
            proxy_request_buffering off;
            proxy_buffering off;
        }

        # Django Admin
        location /admin/ {
            include /run/device-platform-nginx/*.location;
            if (-f /run/platform-updates/maintenance) { return 503; }
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Django静态文件
        location /static/ {
            alias /app/staticfiles/;
        }

        # 媒体文件（上传的镜像、代码包等）
        location /media/ {
            if (-f /run/platform-updates/maintenance) { return 503; }
            alias /app/media/;
            
            # 大文件下载超时
            send_timeout 600s;
            
            # 支持断点续传
            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        # 健康检查
        location = /health {
            access_log off;
            proxy_pass http://127.0.0.1:8000/api/platform/health/;
        }
    }
}

