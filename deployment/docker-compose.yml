version: '3.8'

services:
  # PostgreSQL数据库
  db:
    image: postgres:14-alpine
    container_name: device-mgmt-db
    environment:
      POSTGRES_DB: device_management
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_in_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    networks:
      - backend

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: device-mgmt-redis
    restart: always
    networks:
      - backend

  # Django应用
  web:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: device-mgmt-web
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 4
    environment:
      - DATABASE_URL=postgresql://admin:${DB_PASSWORD:-change_me_in_production}@db:5432/device_management
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-please-change-this-in-production}
      - DEBUG=False
      - ALLOWED_HOSTS=*
    volumes:
      - ../server:/app
      - static_files:/app/staticfiles
    depends_on:
      - db
      - redis
    restart: always
    networks:
      - backend
      - frontend

  # Nginx反向代理
  nginx:
    image: nginx:alpine
    container_name: device-mgmt-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_files:/usr/share/nginx/html/static:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
    restart: always
    networks:
      - frontend

  # Docker Registry（私有镜像仓库）
  registry:
    image: registry:2
    container_name: device-mgmt-registry
    ports:
      - "5000:5000"
    environment:
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
    volumes:
      - registry_data:/var/lib/registry
    restart: always
    networks:
      - backend

volumes:
  postgres_data:
  static_files:
  registry_data:

networks:
  frontend:
  backend:

