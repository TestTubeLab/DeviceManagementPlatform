name: Device Management Platform release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - uses: docker/setup-buildx-action@v3

      - name: Validate release tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be a stable semantic version such as v1.8.0." >&2
            exit 1
          fi
          git show-ref --verify "refs/tags/$RELEASE_TAG"
          echo "version=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build release image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/deploy-simple/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
          build-args: |
            DMP_VERSION=${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release.outputs.revision }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate the released image
        env:
          IMAGE: ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          docker run --rm --network none --entrypoint python "$IMAGE" manage.py test management --noinput
          docker run -d --name dmp-release-smoke --network none "$IMAGE"
          trap 'docker logs --tail 30 dmp-release-smoke; docker rm -f dmp-release-smoke' EXIT
          for attempt in {1..30}; do
            if docker exec dmp-release-smoke curl -fsS --max-time 2 http://127.0.0.1:8081/health |
              python3 -c 'import json, sys; assert json.load(sys.stdin) == {"status": "ok", "version": sys.argv[1]}' "$VERSION"; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          notes_file="$(mktemp)"
          trap 'rm -f "$notes_file"' EXIT
          git tag -l --format='%(contents:body)' "$VERSION" > "$notes_file"
          docker save "$IMAGE_NAME:$VERSION" | gzip -1 > device-platform-linux-amd64.tar.gz
          IMAGE_DIGEST="$(python3 - <<'PY'
          import hashlib
          import json
          import os
          import tarfile
          with tarfile.open("device-platform-linux-amd64.tar.gz", "r:gz") as archive:
              [image] = json.load(archive.extractfile("manifest.json"))
              tag = f"{os.environ['IMAGE_NAME']}:{os.environ['VERSION']}"
              if image["RepoTags"] != [tag]:
                  raise SystemExit("Archive does not contain the expected release tag")
              config = archive.extractfile(image["Config"]).read()
              print("sha256:" + hashlib.sha256(config).hexdigest())
          PY
          )"
          printf '\n\n<!-- dmp-image: %s -->\n' "$IMAGE_DIGEST" >> "$notes_file"
          gh release create "$VERSION" device-platform-linux-amd64.tar.gz --verify-tag --title "$VERSION" --notes-file "$notes_file"
