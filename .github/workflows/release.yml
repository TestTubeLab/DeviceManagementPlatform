name: Device Management Platform release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate release tag
        id: release
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be a stable semantic version such as v1.8.0." >&2
            exit 1
          fi
          echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and publish immutable release image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/deploy-simple/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
          build-args: |
            DMP_VERSION=${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate the released image
        env:
          IMAGE: ${{ steps.release.outputs.image }}@${{ steps.image.outputs.digest }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          docker pull "$IMAGE"
          docker run --rm --network none --entrypoint python "$IMAGE" manage.py test management --noinput
          docker run -d --name dmp-release-smoke --network none "$IMAGE"
          trap 'docker logs --tail 30 dmp-release-smoke; docker rm -f dmp-release-smoke' EXIT
          for attempt in {1..30}; do
            if docker exec dmp-release-smoke curl -fsS --max-time 2 http://127.0.0.1:8081/health |
              python3 -c 'import json, sys; assert json.load(sys.stdin) == {"status": "ok", "version": sys.argv[1]}' "$VERSION"; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          VERSION: ${{ steps.release.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          notes_file="$(mktemp)"
          trap 'rm -f "$notes_file"' EXIT
          git tag -l --format='%(contents:body)' "$VERSION" > "$notes_file"
          printf '\n\n<!-- dmp-image: %s -->\n' "$IMAGE_DIGEST" >> "$notes_file"
          gh release create "$VERSION" --verify-tag --title "$VERSION" --notes-file "$notes_file"
